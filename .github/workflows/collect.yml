name: Collect outage data

# Scheduled workflows only run from the repository's DEFAULT branch, which must be
# claude/first-energy-restoration-tracker-m185by. The collected data is published
# to a separate "tracker-data" branch so frequent data commits don't churn the
# page branch (which keeps CDN hosting of index.html stable).

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub's own cron (unreliable/delayed — kept as a backstop)
  workflow_dispatch:          # manual run
  repository_dispatch:        # external pinger (e.g. cron-job.org) for reliable 15-min cadence
    types: [collect]

permissions:
  contents: write

concurrency:
  group: collect-outage-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # a normal run takes <2 min; cap it so a hung fetch can't hold the (non-cancelling)
    # concurrency slot for hours and stall data collection behind it.
    timeout-minutes: 8
    steps:
      - name: Checkout code branch
        uses: actions/checkout@v4
        with:
          ref: claude/first-energy-restoration-tracker-m185by
          fetch-depth: 1

      - name: Add data worktree (tracker-data branch)
        run: |
          git fetch origin tracker-data --depth=1
          # mount the tracker-data branch at ./data so collect.mjs reads/writes data/state.json
          git worktree add -B tracker-data data origin/tracker-data

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (Playwright for cross-check)
        run: npm install --no-audit --no-fund

      # Cache the Chromium build so we don't re-download ~170MB every run.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.61.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Best-effort independent cross-check (poweroutage.us). Must never block the
      # core collection, so this step always succeeds — collect.mjs reads pou.json
      # only if it is present and fresh.
      - name: Cross-check (poweroutage.us)
        continue-on-error: true
        env:
          POU_FILE: ${{ github.workspace }}/pou.json
        run: node scripts/poweroutage.mjs

      - name: Collect snapshot
        env:
          RESET: ${{ inputs.reset }}
          POU_FILE: ${{ github.workspace }}/pou.json
        run: node scripts/collect.mjs

      - name: Publish to tracker-data
        working-directory: data
        run: |
          git config user.name "outage-tracker-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data change this cycle."
            exit 0
          fi
          git commit -m "data: outage snapshot $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase origin tracker-data && git push origin HEAD:tracker-data && break
            echo "push attempt $i failed, retrying…"; sleep 5
          done
