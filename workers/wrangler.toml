name = "feedback-intake"
main = "feedback-intake.mjs"
compatibility_date = "2024-09-01"

# Public site origin allowed to POST (CORS). Set to your deployed page's origin.
[vars]
REPO = "iamimaginary/Restoration-tracker"
ALLOW_ORIGIN = "https://example.com"

# Rate-limit + private email store (optional but recommended). Create with:
#   wrangler kv namespace create RL
# then paste the id below.
# [[kv_namespaces]]
# binding = "RL"
# id = "<kv-namespace-id>"

# GH_TOKEN is a SECRET, not a var. Set it with:
#   wrangler secret put GH_TOKEN   # a token with `issues: write` on REPO
